# Hardening step: backends accept traffic only from the APISIX gateway.
# (The frontend nginx no longer proxies the APIs, so it needs no access.)
# Only has an effect where the CNI enforces NetworkPolicy (see preflight.sh).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backends-from-gateway
  namespace: sample-app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [backend, orders-backend]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apisix
      ports:
        - port: 8080
