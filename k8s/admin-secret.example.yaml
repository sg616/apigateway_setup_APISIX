# Admin API keys for APISIX + the ingress controller.
# Copy to admin-secret.yaml (gitignored), fill in, apply once:
#   openssl rand -hex 32   # run twice: admin-key, viewer-key
#   kubectl apply -f k8s/admin-secret.yaml
# Never commit the real values.
apiVersion: v1
kind: Secret
metadata:
  name: apisix-admin
  namespace: apisix
type: Opaque
stringData:
  admin-key: CHANGE-ME
  viewer-key: CHANGE-ME
