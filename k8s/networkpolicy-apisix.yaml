# Admin API (9180) and status/metrics ports reachable only from inside the
# apisix namespace (the ingress controller). Proxy port 9080 open to the ELB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apisix-gateway
  namespace: apisix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apisix
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 9080
    - from:
        - podSelector: {}
      ports:
        - port: 9180
        - port: 9091
        - port: 7085
