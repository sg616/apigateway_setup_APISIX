# Gateway routes for the sample app. Replaces the /api/ and /orders-api/
# proxy blocks in sample-project-sky-47-deploy-test/frontend/nginx.conf.
#
# Every match is scoped with `hosts:`. Without it these routes answer on ANY
# Host header, and the `priority: 0` /* catch-all below then shadows the routes
# of every other app on this gateway (e.g. the BPO stack in namespace
# dev-sky47, whose routes live in bnpl-infrastructure-provisioning-service-pk).
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: sample-app
  namespace: sample-app
spec:
  ingressClassName: apisix
  http:
    # Catalog backend. Path kept as-is (controllers are mapped under /api).
    - name: catalog-api
      priority: 10
      match:
        hosts:
          - beta-test.paykoko.pk
        paths:
          - /api/*
      backends:
        - serviceName: backend
          servicePort: 8080
      plugins:
        - name: limit-count
          enable: true
          config:
            count: 600
            time_window: 60
            key_type: var
            key: remote_addr
            rejected_code: 429
            policy: local   # per APISIX pod: effective limit = count x replicas

    # Orders backend. Path kept: Spring context-path is /orders-api.
    - name: orders-api
      priority: 10
      match:
        hosts:
          - beta-test.paykoko.pk
        paths:
          - /orders-api/*
      backends:
        - serviceName: orders-backend
          servicePort: 8080
      plugins:
        - name: limit-count
          enable: true
          config:
            count: 600
            time_window: 60
            key_type: var
            key: remote_addr
            rejected_code: 429
            policy: local

    # SPA (nginx). Lowest priority catch-all. Uses frontend-internal
    # (k8s/frontend-internal.yaml), not the ELB-bound frontend Service.
    - name: frontend
      priority: 0
      match:
        hosts:
          - beta-test.paykoko.pk
        paths:
          - /*
      backends:
        - serviceName: frontend-internal
          servicePort: 80
---
apiVersion: apisix.apache.org/v2
kind: ApisixGlobalRule
metadata:
  name: sample-app-global
  namespace: sample-app
spec:
  ingressClassName: apisix
  plugins:
    - name: request-id
      enable: true
      config:
        header_name: X-Request-Id
        include_in_response: true
    - name: prometheus
      enable: true
      config: {}
