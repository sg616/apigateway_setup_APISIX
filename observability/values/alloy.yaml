# grafana/alloy 1.13.1: DaemonSet that tails container log files on its own
# node and ships them to Loki. ICAgent keeps shipping the same logs to LTS
# (alarms live there).
image:
  registry: swr.pk-isb-1.sky47.com
  repository: pk-beta-repo/alloy
  tag: v1.20.1
  pullSecrets:
    - name: default-secret
configReloader:
  image:
    registry: swr.pk-isb-1.sky47.com
    repository: pk-beta-repo/prometheus-config-reloader
    tag: v0.94.1
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 50m, memory: 64Mi}

controller:
  type: daemonset
  priorityClassName: observability-low
  volumes:
    extra:
      # read positions survive pod restarts, so logs aren't re-shipped
      - name: alloy-data
        hostPath:
          path: /var/lib/alloy-observability
          type: DirectoryOrCreate

alloy:
  storagePath: /var/lib/alloy
  mounts:
    varlog: true
    extra:
      - name: alloy-data
        mountPath: /var/lib/alloy
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
  configMap:
    content: |
      // Pods of interest on this node only
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["sample-app", "apisix", "observability"]
        }
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Low-cardinality labels only: namespace, app, container, pod
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          separator     = ""
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        // The ingress controller pushes config every 10s per APISIX pod. LTS keeps
        // these lines for the heartbeat alarm; Loki doesn't need them.
        stage.drop {
          expression          = "\"uri\":\"/apisix/admin/configs\""
          drop_counter_reason = "apisix_admin_push"
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc:3100/loki/api/v1/push"
        }
      }
