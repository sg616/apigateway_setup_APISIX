# prometheus-community/prometheus 29.36.1: server only. The CCE monitoring
# add-on already runs node-exporter and kube-state-metrics (ns monitoring);
# they are scraped, not duplicated. Metrics backend for Grafana, and the
# remote-write target for Tempo's span metrics / service graph.
imagePullSecrets:
  - name: default-secret

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

configmapReload:
  prometheus:
    image:
      repository: swr.pk-isb-1.sky47.com/pk-beta-repo/prometheus-config-reloader
      tag: v0.94.1
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 50m, memory: 64Mi}

server:
  # CCE's monitoring add-on already owns ClusterRole/Binding "prometheus-server";
  # a distinct name avoids taking those over (Service: obs-prometheus).
  fullnameOverride: obs-prometheus
  image:
    repository: swr.pk-isb-1.sky47.com/pk-beta-repo/prometheus
    tag: v3.15.0
  priorityClassName: observability-low
  retention: 7d
  retentionSize: 8GB
  extraFlags:
    - web.enable-lifecycle
    - web.enable-remote-write-receiver   # Tempo metrics-generator pushes here
    - web.enable-otlp-receiver           # backends' Java agent pushes JVM/HTTP metrics (OTLP)
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: csi-disk-topology
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "1", memory: 1536Mi}
  service:
    type: ClusterIP

# OTLP metrics (Java agent): keep these resource attributes as labels
serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
      - /etc/config/rules
      - /etc/config/alerts
    otlp:
      promote_resource_attributes:
        - service.name
        - k8s.namespace.name

# Only these jobs. The chart's generic ones are switched off.
scrapeConfigs:
  kubernetes-api-servers: {enabled: false}
  kubernetes-nodes: {enabled: false}
  kubernetes-service-endpoints: {enabled: false}
  kubernetes-service-endpoints-slow: {enabled: false}
  prometheus-pushgateway: {enabled: false}
  kubernetes-services: {enabled: false}
  kubernetes-pods: {enabled: false}
  kubernetes-pods-slow: {enabled: false}
  # prometheus (self) and kubernetes-nodes-cadvisor (container CPU/memory) stay on.

  apisix:
    metrics_path: /apisix/prometheus/metrics
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces: {names: [apisix]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: apisix-prometheus-metrics
        action: keep
      # endpointslice SD also yields every other container port of the pod
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "9091"
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  node-exporter:
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces: {names: [monitoring]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
  kube-state-metrics:
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces: {names: [monitoring]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: kube-state-metrics-prom
        action: keep
      # endpointslice SD also yields every other container port of the pod
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "8080"
        action: keep
  # Self-metrics of the stack (dashboard "Observability stack health")
  observability:
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces: {names: [observability]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_pod_container_port_number]
        regex: "loki;3100|tempo;3200|alloy;12345|grafana;3000"
        action: keep
      - source_labels: [__meta_kubernetes_service_name]
        target_label: component
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    metric_relabel_configs:
      # Grafana internals no dashboard uses (~1.8k series)
      - source_labels: [__name__]
        regex: grafana_apiserver_.*|grafana_feature_toggles_info
        action: drop
  # PVC usage. Kubelet scraped directly like the cadvisor job; only volume stats kept.
  kubelet:
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kubelet_volume_stats_.*
        action: keep

