# Helm values for chart apisix 2.17.1 on sky47 CCE.
# Mode: etcd-less. APISIX runs with config_provider=yaml and the ingress
# controller (2.x, provider apisix-standalone) pushes the full config to every
# APISIX pod through the Admin API. Source of truth = CRDs in git (routes/).

global:
  imagePullSecrets:
    - default-secret

image:
  repository: swr.pk-isb-1.sky47.com/pk-beta-repo/apisix
  tag: 3.18.0-ubuntu

# --- availability -----------------------------------------------------------
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# Soft anti-affinity: spread across nodes when there is more than one
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
              app.kubernetes.io/instance: apisix
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
timezone: Asia/Karachi

# CCE monitoring (prometheus-operator in ns monitoring) selects every
# ServiceMonitor and remote-writes to AOM, so this puts apisix_* metrics in AOM.
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s

# --- services ---------------------------------------------------------------
# Chart Service stays internal. The ELB-facing Service lives in k8s/gateway-lb*.yaml
# so the cut-over never needs a helm upgrade.
service:
  type: ClusterIP

etcd:
  enabled: false
# Unused in yaml mode; empty user stops the chart creating an etcd password Secret/env
externalEtcd:
  user: ""

apisix:
  deployment:
    mode: traditional
    role: traditional
    role_traditional:
      config_provider: yaml

  enableServerTokens: false
  enableIPv6: false

  admin:
    enabled: true
    type: ClusterIP
    # Key comes from Secret apisix-admin (scripts/create-secrets.sh), never from git
    credentials:
      secretName: apisix-admin
      secretAdminKey: admin-key
      secretViewerKey: viewer-key
    # Note: with the ingress controller enabled the chart also adds 0.0.0.0/0 here,
    # so the real restriction is k8s/networkpolicy-apisix.yaml.
    allow:
      ipList:
        - 127.0.0.1/24

  nginx:
    http:
      # ELB (HTTPS listener) adds X-Forwarded-For. Trust only the VPC (nodes,
      # ELB private IP 10.10.1.229) and the container CIDR (kube-proxy SNAT).
      realIpHeader: X-Forwarded-For
      realIpRecursive: "on"
      realIpFrom:
        - 127.0.0.1
        - 10.10.0.0/16
        - 172.16.0.0/16
    logs:
      accessLog: /dev/stdout
      accessLogFormatEscape: json
      # JSON so LTS can index status / latency fields for alarms
      accessLogFormat: '{"time":"$time_iso8601","client_ip":"$remote_addr","request_id":"$http_x_request_id","method":"$request_method","host":"$host","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","upstream_time":"$upstream_response_time","user_agent":"$http_user_agent","path":"$uri","trace_id":"$opentelemetry_trace_id"}'
      errorLog: /dev/stderr
      errorLogLevel: warn

  prometheus:
    enabled: true

  # APISIX 3.18 default plugin list (apisix/cli/config.lua, 107 plugins) + opentelemetry,
  # which ships disabled. Setting this list replaces the default, so keep it complete.
  plugins:
    - real-ip
    - ai
    - client-control
    - proxy-buffering
    - proxy-control
    - request-id
    - zipkin
    - ext-plugin-pre-req
    - fault-injection
    - mocking
    - serverless-pre-function
    - cors
    - ip-restriction
    - ua-restriction
    - referer-restriction
    - csrf
    - uri-blocker
    - request-validation
    - chaitin-waf
    - multi-auth
    - openid-connect
    - saml-auth
    - cas-auth
    - authz-casbin
    - authz-casdoor
    - wolf-rbac
    - ldap-auth-advanced
    - ldap-auth
    - hmac-auth
    - basic-auth
    - jwt-auth
    - jwe-decrypt
    - key-auth
    - dingtalk-auth
    - feishu-auth
    - acl
    - consumer-restriction
    - attach-consumer-label
    - forward-auth
    - opa
    - authz-keycloak
    - data-mask
    - proxy-cache
    - body-transformer
    - ai-prompt-template
    - ai-prompt-decorator
    - ai-prompt-guard
    - ai-rag
    - ai-rate-limiting
    - ai-proxy-multi
    - ai-proxy
    - ai-cache
    - ai-aws-content-moderation
    - ai-aliyun-content-moderation
    - ai-lakera-guard
    - proxy-mirror
    - graphql-proxy-cache
    - proxy-rewrite
    - workflow
    - api-breaker
    - graphql-limit-count
    - limit-conn
    - limit-count
    - limit-req
    - gzip
    - traffic-label
    - traffic-split
    - redirect
    - response-rewrite
    - oas-validator
    - mcp-bridge
    - degraphql
    - kafka-proxy
    - grpc-transcode
    - grpc-web
    - http-dubbo
    - public-api
    - prometheus
    - datadog
    - lago
    - loki-logger
    - elasticsearch-logger
    - echo
    - loggly
    - http-logger
    - splunk-hec-logging
    - skywalking-logger
    - google-cloud-logging
    - sls-logger
    - tcp-logger
    - kafka-logger
    - rocketmq-logger
    - syslog
    - udp-logger
    - file-logger
    - clickhouse-logger
    - tencent-cloud-cls
    - inspect
    - example-plugin
    - aws-lambda
    - azure-functions
    - openwhisk
    - openfunction
    - serverless-post-function
    - ext-plugin-post-req
    - ext-plugin-post-resp
    - ai-request-rewrite
    - opentelemetry

  pluginAttrs:
    opentelemetry:
      trace_id_source: random           # X-Request-Id is a UUID, not a valid trace id
      resource:
        service.name: apisix
      collector:
        address: tempo.observability.svc:4318
        request_timeout: 3
        request_headers: {}
      batch_span_processor:
        drop_on_queue_full: true        # never let a slow/absent Tempo hold requests
        max_queue_size: 2048
        batch_timeout: 2
        inactive_timeout: 1
        max_export_batch_size: 64
      set_ngx_var: true                 # exposes $opentelemetry_trace_id to the access log

# --- ingress controller (subchart, controller 2.2.0) ------------------------
ingress-controller:
  enabled: true
  deployment:
    replicas: 1
    image:
      repository: swr.pk-isb-1.sky47.com/pk-beta-repo/apisix-ingress-controller
      tag: "2.2.0"
    adcContainer:
      image:
        repository: swr.pk-isb-1.sky47.com/pk-beta-repo/adc
        tag: "0.27.1"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  config:
    provider:
      type: apisix-standalone
      # A restarted APISIX pod starts empty (readiness /status/ready stays false)
      # until the next push, so keep this short.
      syncPeriod: 10s
    kubernetes:
      ingressClass: apisix
      defaultIngressClass: false
  webhook:
    enabled: false
  gatewayProxy:
    createDefault: true
    provider:
      type: ControlPlane
      controlPlane:
        service:
          name: apisix-admin
          port: 9180
        auth:
          type: AdminKey
          adminKey:
            valueFrom:
              secretKeyRef:
                name: apisix-admin
                key: admin-key
